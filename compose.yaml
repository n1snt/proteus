name: proteus

services:
  app:
    build:
      context: .
    image: ${PROTEUS_IMAGE:-proteus:local}
    environment:
      PROTEUS_DATABASE_URL: postgresql://postgres:${PROTEUS_POSTGRES_PASSWORD:-proteus_local}@metadata:5432/proteus
      PROTEUS_SANDBOX_URL: postgresql://postgres:${PROTEUS_POSTGRES_PASSWORD:-proteus_local}@sandbox:5432/proteus_sandbox
      PROTEUS_MODE: ${PROTEUS_MODE:-local}
      PROTEUS_SECRET_KEY: ${PROTEUS_SECRET_KEY:-development-only-change-before-sharing}
      PROTEUS_STATIC_DIR: /app/static
      PROTEUS_COOKIE_SECURE: ${PROTEUS_COOKIE_SECURE:-false}
      PROTEUS_DEMO_TTL_HOURS: ${PROTEUS_DEMO_TTL_HOURS:-24}
      PROTEUS_MAX_PROJECTS: ${PROTEUS_MAX_PROJECTS:-20}
      PROTEUS_MAX_BRANCHES: ${PROTEUS_MAX_BRANCHES:-20}
    networks:
      - proteus
    depends_on:
      metadata:
        condition: service_healthy
      sandbox:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test:
        ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=2).read()"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  metadata:
    image: postgres:17-bookworm
    environment:
      POSTGRES_DB: proteus
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${PROTEUS_POSTGRES_PASSWORD:-proteus_local}
    volumes:
      - metadata_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d proteus"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    networks:
      - proteus

  sandbox:
    image: postgres:17-bookworm
    environment:
      POSTGRES_DB: proteus_sandbox
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${PROTEUS_POSTGRES_PASSWORD:-proteus_local}
    volumes:
      - sandbox_data:/var/lib/postgresql/data
      - ./fixtures/demo.sql:/docker-entrypoint-initdb.d/10-demo.sql:ro
    ports:
      - "127.0.0.1:55433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d proteus_sandbox"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    networks:
      - proteus

volumes:
  metadata_data:
  sandbox_data:

networks:
  proteus:
    name: ${PROTEUS_NETWORK_NAME:-proteus_internal}
    ipam:
      config:
        - subnet: ${PROTEUS_NETWORK_SUBNET:-172.28.0.0/16}
